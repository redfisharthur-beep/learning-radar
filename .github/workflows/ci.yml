name: Learning Radar CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Generate reproducible npm lockfile
        run: npm install --package-lock-only --no-audit --no-fund

      - name: Upload npm lockfile
        uses: actions/upload-artifact@v4
        with:
          name: learning-radar-package-lock
          path: package-lock.json
          if-no-files-found: error
          retention-days: 7

      - name: Install locked dependencies
        run: npm ci --no-audit --no-fund

      - name: Type check
        run: npm run typecheck

      - name: Build
        run: npm run build
        env:
          NEXT_PUBLIC_SUPABASE_URL: https://znyxrlgurvvjwyrxepqv.supabase.co
          NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: ci-placeholder-publishable-key
